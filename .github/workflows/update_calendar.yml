name: Hourly University Update

on:
  schedule:
    # '0 5-15 * * 1-5' = Stündlich von 6:00 bis 16:00 Uhr deutscher Zeit (Mo-Fr)
    - cron: '0 5-15 * * 1-5'
  workflow_dispatch: # Erlaubt manuelles Starten zum Testen

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wichtig für den Push-Vorgang

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager icalendar

      - name: Run Scraper
        run: python scraper.py

      - name: Deploy to calendarLive branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Ordner vorbereiten und Datei kopieren
          mkdir export_dir
          cp th_schedule.ics export_dir/
          cd export_dir
          
          # 2. Neues Git-Projekt im Unterordner starten
          git init
          
          # 3. Identität festlegen (MUSS nach git init kommen!)
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 4. Datei hinzufügen und committen
          git add th_schedule.ics
          git commit -m "Update calendar: $(date)" || echo "No changes"
          
          # 5. Der Power-Push direkt auf den Branch calendarLive
          git push --force https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:calendarLive
